<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Canteen - Login</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #fafafa;
    }

    header {
      text-align: center;
      padding: 20px 0;
      background: #ff9800;
      color: white;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Hero Section */
    .hero {
      padding: 40px 20px;
      text-align: center;
      background: linear-gradient(to bottom, #ffe0b3, #fff);
    }

    .hero img {
      width: 200px;
      height: 200px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #ff6f00;
    }

    .hero p {
      font-size: 18px;
      color: #333;
      margin-bottom: 25px;
    }

    .hero-btn {
      padding: 14px 35px;
      font-size: 18px;
      font-weight: bold;
      background: #ff9800;
      border: none;
      color: white;
      border-radius: 50px;
      text-decoration: none;
      transition: 0.3s;
      display: inline-block;
    }

    .hero-btn:hover {
      background: #ff6f00;
      transform: scale(1.05);
    }

    /* Login Card */
    .login-container {
      max-width: 400px;
      margin: 40px auto;
      background: white;
      padding: 30px 35px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #ff6f00;
      font-size: 26px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 15px;
      color: #333;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: #ff9800;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #ff6f00;
    }

    .signup-link {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .signup-link a {
      color: #ff6f00;
      font-weight: bold;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 15px 0;
      margin-top: 30px;
      font-size: 14px;
      background: #eee;
    }
  </style>
</head>

<body>

<header>
  Smart Canteen Ordering System
</header>

<!-- 🌟 Hero / Interface Section With Image -->
<section class="hero">
  <img src="https://is1-ssl.mzstatic.com/image/thumb/Purple126/v4/3a/65/e2/3a65e2a7-b3a6-2e87-f224-c7f5bc60f82c/AppIcon-0-0-1x_U007emarketing-0-0-0-10-0-0-sRGB-0-0-0-GLES2_U002c0-512MB-85-220-0-0.png/1200x630wa.png" alt="Canteen App Logo">

  <h1>Fresh • Fast • Smart</h1>
  <p>Order delicious meals instantly—skip the queue and enjoy convenience!</p>

  <a href="#login" class="hero-btn">Get Started</a>
</section>

<!-- 🌟 Login Section -->
<div class="login-container" id="login">
  <h2>Login</h2>
  <form action="menu.html">
    <label>Email:</label>
    <input type="email" placeholder="Enter your email" required>

    <label>Password:</label>
    <input type="password" placeholder="Enter your password" required>

    <button type="submit">Login</button>

    <p class="signup-link">
      Don't have an account? <a href="#">Sign up</a>
    </p>
  </form>
</div>

<footer>
  © 2025 Smart Canteen | Developed by B.Tech Students
</footer>

</body>
</html>
