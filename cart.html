<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Canteen - Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Your Cart</h1>
    <nav>
      <a href="menu.html">Back to Menu</a>
    </nav>
  </header>

  <section class="cart">
    <table>
      <tr>
        <th>Item</th>
        <th>Quantity</th>
        <th>Price</th>
      </tr>
      <tr>
        <td>Veg Burger</td>
        <td>2</td>
        <td>₹100</td>
      </tr>
      <tr>
        <td>Cheese Pizza</td>
        <td>1</td>
        <td>₹120</td>
      </tr>
      <tr class="total">
        <td colspan="2">Total</td>
        <td>₹220</td>
      </tr>
    </table>

    <div class="cart-actions">
      <button>Proceed to Payment</button>
      <button>Cancel Order</button>
    </div>
  </section>

  <footer>
    <p>© 2025 Smart Canteen</p>
  </footer>
</body>
</html>
